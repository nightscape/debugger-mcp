[package]
name = "debugger_mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
clap = { version = "4.5.48", features = ["derive"] }
flume = "0.11.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shellexpand = "3.1"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
sysinfo = "0.35"
# Token-Oriented Object Notation: compact, lossless JSON alternative for LLM output.
# Library only — the default `cli` feature pulls ratatui/tiktoken/clap and is not needed here.
toon-format = { version = "0.5.0", default-features = false }

[dev-dependencies]
tempfile = "3.23.0"
tokio-test = "0.4.4"
mockall = "0.13.1"
assert_matches = "1.5.0"
assert_cmd = "2.0"
predicates = "3.1"
sysinfo = "0.35"
proptest = "1"
proptest-state-machine = "0.8"
# Token counting for the JSON-vs-TOON savings measurement test. o200k_base is the
# GPT-4o tokenizer used as the public proxy by the TOON project's own benchmarks.
tiktoken-rs = "0.7"

[[test]]
name = "fake_dap_adapter"
path = "tests/bin/fake_dap_adapter.rs"
harness = false

# Unit-like integration tests
[[test]]
name = "adapter_logging_test"
path = "tests/unit/adapter_logging_test.rs"

# Diagnostic tests
[[test]]
name = "dap_direct_test"
path = "tests/diagnostic/dap_direct_test.rs"

[[test]]
name = "event_driven_test"
path = "tests/diagnostic/event_driven_test.rs"

# Core integration tests
[[test]]
name = "stop_on_entry_test"
path = "tests/integration/core/stop_on_entry_test.rs"

[[test]]
name = "user_feedback_test"
path = "tests/integration/core/user_feedback_test.rs"

[[test]]
name = "multi_session_test"
path = "tests/integration/core/multi_session_test.rs"

[[test]]
name = "ruby_socket_adapter_test"
path = "tests/integration/core/ruby_socket_adapter_test.rs"

# Language-specific matrix integration tests
[[test]]
name = "python_integration_test"
path = "tests/integration/lang/python_integration_test.rs"

[[test]]
name = "ruby_integration_test"
path = "tests/integration/lang/ruby_integration_test.rs"

[[test]]
name = "nodejs_integration_test"
path = "tests/integration/lang/nodejs_integration_test.rs"

[[test]]
name = "go_integration_test"
path = "tests/integration/lang/go_integration_test.rs"

[[test]]
name = "rust_integration_test"
path = "tests/integration/lang/rust_integration_test.rs"

# Model-checked Rust integration tests
[[test]]
name = "rust_model_test"
path = "tests/integration/lang/rust_model_test.rs"

[[test]]
name = "rust_proptest_test"
path = "tests/integration/rust_proptest_test.rs"

# Mini-Rust DSL: AST + interpreter + codegen smoke test (PBT reference scaffolding)
[[test]]
name = "mini_rust_smoke_test"
path = "tests/integration/mini_rust_smoke_test.rs"

# Mini-Rust DSL: full PBT driving CodeLLDB against generated programs
[[test]]
name = "mini_rust_pbt_test"
path = "tests/integration/mini_rust_pbt_test.rs"

# Mini-Rust DSL: pinned regression test for CodeLLDB child layout assumptions
# the Map/Vec oracle relies on. Auto-skips when `codelldb` isn't on PATH.
[[test]]
name = "mini_rust_map_layout_probe"
path = "tests/integration/mini_rust_map_layout_probe.rs"

# Memory-pressure PBT — reproduces the LLDB synthetic-provider explosion when
# get_variables/evaluate touches large containers. Currently expected to fail
# against the unfixed adapter; runs `--ignored` so it stays out of default CI.
[[test]]
name = "mini_rust_memory_pbt_test"
path = "tests/integration/mini_rust_memory_pbt_test.rs"

# REPL passthrough — verifies `debugger_evaluate(context: "repl")` returns the
# real LLDB stdout/stderr instead of an empty string. Reproduces the silent-
# REPL failure mode reported in user feedback.
[[test]]
name = "repl_passthrough_test"
path = "tests/integration/repl_passthrough_test.rs"

# Line-tables-only DWARF — verifies the variables tool surfaces a clear hint
# when locals were stripped by the build profile, instead of silently returning
# []. Reproduces the misleading-error failure mode reported in user feedback.
[[test]]
name = "line_tables_only_test"
path = "tests/integration/line_tables_only_test.rs"

# Async state-machine OOM — reproduces failure mode #5: inspecting locals at an
# `.await` suspension point can blow up LLDB because the compiler-generated
# `{async_fn_env#N}` is a tagged union of all suspension variants. Pinned
# `#[ignore]` regression guards + one living-document expected-fail.
[[test]]
name = "async_state_machine_pbt_test"
path = "tests/integration/async_state_machine_pbt_test.rs"

# Async-closure initial-stop hang — reproduces failure mode #6: the very first
# locals fetch on stop inside an async-fn-generated `{closure#…}` frame hangs
# LLDB when captures include recursive `Value::Object(HashMap<String, Value>)`.
# Pinned regression guards for the 2026-05-15 skip-locals fix
# (`is_async_closure_frame` in `src/debug/async_state.rs`) and recovery paths
# (`debugger_get_variables` with `noSynthetic:true`, `debugger_cancel`).
[[test]]
name = "async_closure_initial_stop_test"
path = "tests/integration/async_closure_initial_stop_test.rs"

# 7th LLDB failure-mode reproducer: reading one scalar out of a *synchronous*
# frame whose `&mut self` owns several large HashMap/BTreeMap fields. The async
# detectors in `src/debug/async_state.rs` don't fire here, so nothing currently
# keeps the scope-level `variables` request off CodeLLDB's per-Variable summary
# walk. Also pins the REPL expression-form inconsistencies from the same report.
[[test]]
name = "heavy_sync_frame_test"
path = "tests/integration/heavy_sync_frame_test.rs"

# TOON vs JSON token-savings measurement over representative tool outputs.
[[test]]
name = "toon_token_savings_test"
path = "tests/integration/toon_token_savings_test.rs"

[[test]]
name = "rust_init_test"
path = "tests/integration/lang/rust_init_test.rs"

# Extended Rust integration tests (timeout/stuck, variable inspection, stepping)
[[test]]
name = "rust_extended_test"
path = "tests/integration/lang/rust_extended_test.rs"

# Timeout and stuck debugger tests (Python)
[[test]]
name = "timeout_stuck_test"
path = "tests/integration/core/timeout_stuck_test.rs"

# Memory explosion test (CodeLLDB + large data structures)
[[test]]
name = "memory_explosion_test"
path = "tests/integration/core/memory_explosion_test.rs"
